# Guarded manual deployment of the verified site. No automatic trigger.
# Reference: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Publish verified osu-lab site
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jamesliuai/osu-lab'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout allowlisted repository
        uses: actions/checkout@v6
      - name: Require verified website publication inventory
        run: python3 -I -S -B tools/verify_publication.py --site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Archive the exact verified site including its empty marker
        run: tar --directory site --create --file "$RUNNER_TEMP/artifact.tar" .
      - name: Upload only the verified static site
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
